version: "3.9"

services:
  node-1:
    build: .
    container_name: memora-node-1
    ports:
      - "9090:9090"
      - "5005:5005"
    networks:
      memora-net:
        aliases:
          - node-1

  node-2:
    build: .
    container_name: memora-node-2
    ports:
      - "9091:9090"
      - "5006:5005"
    environment:
      - DELAY=1
    networks:
      memora-net:
        aliases:
          - node-2

  node-3:
    build: .
    container_name: memora-node-3
    ports:
      - "9092:9090"
      - "5007:5005"
    environment:
      - DELAY=2
    networks:
      memora-net:
        aliases:
          - node-3

  node-4:
    build: .
    container_name: memora-node-4
    ports:
      - "9093:9090"
      - "5008:5005"
    environment:
      - DELAY=3
    networks:
      memora-net:
        aliases:
          - node-4

  node-5:
    build: .
    container_name: memora-node-5
    ports:
      - "9094:9090"
      - "5009:5005"
    environment:
      - DELAY=3
    networks:
      memora-net:
        aliases:
          - node-5

networks:
  memora-net:
    driver: bridge
